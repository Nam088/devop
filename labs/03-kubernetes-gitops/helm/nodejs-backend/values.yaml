replicaCount: 3

image:
  repository: nodejs-production
  tag: v1.0.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  host: nodejs.devops.local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  startup:
    path: /health
    failureThreshold: 15
    periodSeconds: 2
  readiness:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 3
    timeoutSeconds: 2
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

env:
  NODE_ENV: "production"
  PORT: "3000"
